name: LiDARLab

options:
  bundleIdPrefix: com.esshoo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    PRODUCT_BUNDLE_IDENTIFIER: com.esshoo.LiDARLab
    PRODUCT_NAME: LiDARLab
    DEVELOPMENT_LANGUAGE: ar
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "LiDAR Lab"
    INFOPLIST_KEY_NSCameraUsageDescription: "يحتاج LiDAR Lab إلى الكاميرا وحساس LiDAR لعرض العمق وقياس المسافات وفهم البيئة المحيطة."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages: {}

targets:
  LiDARLab:
    type: application
    platform: iOS
    sources:
      - path: LiDARLab
    dependencies:
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - sdk: ImageIO.framework
      - sdk: CoreMotion.framework
      - sdk: Vision.framework
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  LiDARLab:
    build:
      targets:
        LiDARLab: all
    run:
      config: Debug
    archive:
      config: Release
