name: LiDARLab

options:
  bundleIdPrefix: com.essam.3E
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.40.3"
    CURRENT_PROJECT_VERSION: "43"
    PRODUCT_BUNDLE_IDENTIFIER: com.essam.3E.LiDARLab
    PRODUCT_NAME: LiDARLab
    DEVELOPMENT_LANGUAGE: ar
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  LiDARLab:
    type: application
    platform: iOS
    sources:
      - path: LiDARLab
        excludes:
          - "**/*.md"
    info:
      path: LiDARLab/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleDisplayName: 3ELiDAR
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: "يحتاج 3ELiDAR إلى الكاميرا وحساس LiDAR لعرض العمق وقياس المسافات وفهم البيئة المحيطة."
        NSLocalNetworkUsageDescription: "يحتاج 3ELiDAR إلى الشبكة المحلية لإرسال واستقبال وحفظ جلسات المسح بين iPhone وiPad وبرنامج Windows."
        NSBonjourServices:
          - _3eld._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.essam.3E.LiDARLab
            CFBundleURLSchemes:
              - lidar
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: RoomPlan.framework
      - sdk: SceneKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - sdk: ImageIO.framework
      - sdk: Vision.framework
      - sdk: QuickLook.framework
      - sdk: Network.framework
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  LiDARLab:
    build:
      targets:
        LiDARLab: all
    run:
      config: Debug
    archive:
      config: Release
